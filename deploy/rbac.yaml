apiVersion: v1
kind: Namespace
metadata:
  name: modeswitch-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modeswitch-controller
  namespace: modeswitch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: modeswitch-controller
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: modeswitch-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: modeswitch-controller
subjects:
  - kind: ServiceAccount
    name: modeswitch-controller
    namespace: modeswitch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modeswitch-leader-election
  namespace: modeswitch-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modeswitch-leader-election
  namespace: modeswitch-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: modeswitch-leader-election
subjects:
  - kind: ServiceAccount
    name: modeswitch-controller
    namespace: modeswitch-system
