apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeswitch-controller
  namespace: modeswitch-system
spec:
  replicas: 2   # leader-elected; only the leader holds the gRPC stream
  selector:
    matchLabels: {app: modeswitch-controller}
  template:
    metadata:
      labels: {app: modeswitch-controller}
    spec:
      serviceAccountName: modeswitch-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: ghcr.io/example/modeswitch-controller:dev
          args:
            - --mode-server=mode-server.ops.svc.cluster.local:50051
            - --mode-server-insecure      # remove once TLS is in place
            - --modes=normal,peak,offpeak,maintenance,standby
            - --leader-elect
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
