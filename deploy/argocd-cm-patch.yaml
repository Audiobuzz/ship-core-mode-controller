# Merge into argocd-cm. Applies to every Application, but is naturally scoped:
# only fields owned by the modeswitch-controller field manager are ignored, so
# Deployments that aren't mode-switched keep normal replicas behaviour.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  resource.customizations.ignoreDifferences.apps_Deployment: |
    managedFieldsManagers:
      - modeswitch-controller
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    managedFieldsManagers:
      - modeswitch-controller
