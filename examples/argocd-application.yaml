apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.example.com/platform/apps.git
    path: ingest
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: ingest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Required: without this, ignoreDifferences only hides the diff and
      # any sync still writes Git's replicas over the controller's.
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
